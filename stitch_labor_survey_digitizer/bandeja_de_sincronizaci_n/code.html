</div>

<!-- Success State (Hidden initially) -->

<span class="material-symbols-outlined text-[24px]">dashboard</span>
<span class="font-label-caps text-label-caps mt-1">Overview</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest h-full w-full max-w-[80px]" href="#">
<span class="material-symbols-outlined text-[24px]">assignment</span>
<span class="font-label-caps text-label-caps mt-1">Forms</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 h-[60px] w-full max-w-[80px]" href="#">
<span class="material-symbols-outlined text-[24px] icon-fill">sync</span>
<span class="font-label-caps text-label-caps mt-1 text-primary">Sync</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest h-full w-full max-w-[80px]" href="#">
<span class="material-symbols-outlined text-[24px]">settings</span>
<span class="font-label-caps text-label-caps mt-1">Settings</span>
</a>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('syncButton');
            const progressContainer = document.getElementById('syncProgress');
            const successContainer = document.getElementById('syncSuccess');
            const fill = document.getElementById('progressBarFill');

            if(btn && progressContainer && successContainer && fill) {
                btn.addEventListener('click', () => {
                    // Hide button, show progress
                    btn.classList.add('hidden');
                    progressContainer.classList.remove('hidden');
                    progressContainer.classList.add('flex');
                    
                    // Start animation
                    fill.classList.add('animate-sync');

                    // Listen for animation end
                    fill.addEventListener('animationend', () => {
                        // Hide progress, show success
                        progressContainer.classList.add('hidden');
                        progressContainer.classList.remove('flex');
                        
                        successContainer.classList.remove('hidden');
                        successContainer.classList.add('flex');

                        // Optional: Reset after a few seconds
                        setTimeout(() => {
                            successContainer.classList.add('hidden');
                            successContainer.classList.remove('flex');
                            btn.classList.remove('hidden');
                            fill.classList.remove('animate-sync');
                        }, 3000);
                    }, { once: true });
                });
            }
        });
    </script>
