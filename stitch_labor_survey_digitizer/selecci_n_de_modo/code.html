<!DOCTYPE html>

<html class="dark" lang="es"><head>

                        "on-tertiary": "#003641",
                        "inverse-primary": "#7c5800",
                        "outline": "#9e8f78",
                        "on-tertiary-container": "#005a6b",
                        "on-primary-container": "#6b4c00",
                        "on-error": "#690005",
                        "surface-container": "#201f1f",

                    "spacing": {
                        "gutter-md": "24px",
                        "unit": "8px",
                        "margin-edge": "32px",

                        "container-max": "1440px"

                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "data-lg": ["JetBrains Mono"],
                        "label-caps": ["JetBrains Mono"],

<style>
        .industrial-card {
            transition: all 0.2s ease;
            box-shadow: none;
        }
        .industrial-card:active {
            transform: scale(0.98);
            background-color: theme('colors.surface-container-highest');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar (From JSON) -->
<header class="w-full top-0 sticky border-b-2 border-outline-variant dark:border-outline-variant bg-surface dark:bg-surface z-40">
<div class="flex items-center justify-between px-margin-edge h-touch-target w-full">
<div class="flex items-center gap-4">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-high p-2 rounded active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface dark:text-on-surface">Field Survey</h1>
</div>
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container-high p-2 rounded active:scale-95 transition-transform flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="cloud_sync">cloud_sync</span>
</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow p-gutter-md md:p-margin-edge max-w-container-max mx-auto w-full flex flex-col gap-6">
<!-- Context Selectors -->
<section class="bg-surface-container p-gutter-md border-2 border-outline-variant rounded flex flex-col md:flex-row gap-6">
<div class="flex-1 flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="municipio">Municipio</label>
<div class="relative">
<select class="w-full bg-surface-dim border-2 border-outline-variant rounded text-on-surface h-touch-target px-4 appearance-none focus:border-primary focus:ring-0 font-data-lg text-data-lg" id="municipio">
<option value="1">Sector Norte - Zona Industrial</option>
<option value="2">Sector Sur - Comercial</option>
<option value="3">Centro Histórico</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">arrow_drop_down</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="fecha">Fecha de caracterización</label>
<input class="w-full bg-surface-dim border-2 border-outline-variant rounded text-on-surface h-touch-target px-4 focus:border-primary focus:ring-0 font-data-lg text-data-lg [color-scheme:dark]" id="fecha" type="date" value="2023-10-25"/>
</div>
</section>
<!-- Mode Selection Header -->
<div class="mt-4 border-b border-outline-variant pb-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-fixed-dim">Selección de Modalidad</h2>
<p class="text-on-surface-variant mt-1">Seleccione el tipo de encuesta a realizar en la ubicación actual.</p>
</div>
<!-- Mode Cards -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-grow pb-24 md:pb-0">
<!-- Mode 1 -->
<button class="industrial-card bg-surface-container-high border-2 border-outline-variant rounded flex flex-col items-center justify-center p-8 gap-6 group hover:border-primary-container h-full min-h-[300px]">
<div class="bg-surface-dim p-6 rounded-full border-2 border-outline-variant group-hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[64px] text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">pedal_bike</span>
</div>
<div class="text-center">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface group-hover:text-primary-container transition-colors mb-2">Ambulante / Semiestacionario</h3>
<div class="inline-flex items-center justify-center bg-surface border border-outline-variant px-3 py-1 rounded">
<span class="font-data-lg text-data-lg text-on-surface-variant">4 Páginas</span>
</div>
</div>
</button>
<!-- Mode 2 -->
<button class="industrial-card bg-surface-container-high border-2 border-outline-variant rounded flex flex-col items-center justify-center p-8 gap-6 group hover:border-primary-container h-full min-h-[300px]">
<div class="bg-surface-dim p-6 rounded-full border-2 border-outline-variant group-hover:border-primary-container transition-colors">
<span class="material-symbols-outlined text-[64px] text-primary-fixed-dim" style="font-variation-settings: 'FILL' 0;">store</span>
</div>
<div class="text-center">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface group-hover:text-primary-container transition-colors mb-2">Estacionario</h3>
<div class="flex flex-col items-center gap-2">
<div class="inline-flex items-center justify-center bg-surface border border-outline-variant px-3 py-1 rounded">
<span class="font-data-lg text-data-lg text-on-surface-variant">5 Páginas</span>
</div>
<span class="font-label-caps text-label-caps text-tertiary-fixed-dim">INCLUYE PARTE II</span>
</div>
</div>
</button>
</section>
</main>
<!-- BottomNavBar (From JSON) - Mobile Only -->
<nav class="md:hidden fixed bottom-0 w-full z-50 h-20 border-t-2 border-outline-variant dark:border-outline-variant bg-surface-container dark:bg-surface-container">
<div class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe h-20">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="font-label-caps text-[10px] uppercase">Overview</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-1 hover:bg-surface-container-highest transition-colors active:bg-secondary-fixed-dim w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="assignment" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="font-label-caps text-[10px] uppercase">Forms</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="sync">sync</span>
<span class="font-label-caps text-[10px] uppercase">Sync</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded transition-colors w-16" href="#">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="font-label-caps text-[10px] uppercase">Settings</span>
</a>
</div>
</nav>
</body></html>
